<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egyptian Matching Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- START SCREEN -->
    <section id="start-screen" class="screen">
        <h1>Egyptian Memory Card Game</h1>

        <div class="difficulty-container">
            <label for="difficulty">Choose Difficulty:</label>

            <select id="difficulty">
                <option value="6">Easy</option>
                <option value="12" selected>Default</option>
                <option value="23">Hard</option>
            </select>
        </div>

        <button id="start-game" disabled>Loading...</button>
        <p id="start-error"></p>
    </section>


    <!-- GAME SCREEN -->
    <section id="game-screen" class="screen" hidden>

        <h1>Egyptian Memory Card Game</h1>

        <div class="game-info">
            <p>Moves: <span id="moves">0</span></p>
            <p>Matches: <span id="matches">0</span></p>
        </div>

        <div id="game-board" class="game-board"></div>

        <p id="message"></p>

        <button id="restart">Restart Game</button>

    </section>

    <!-- VICTORY SCREEN -->
    <section id="victory-screen" class="screen" hidden>

        <h1 class="victory-title">Congratulations!</h1>

        <h2 class="victory-subtitle">You Won!</h2>

        <p>You found all the Egyptian symbols!</p>

        <div class="results-container">

            <div class="result-item">
                <h3>Matches</h3>
                <p id="final-matches">0</p>
            </div>

            <div class="result-item">
                <h3>Moves</h3>
                <p id="final-moves">0</p>
            </div>

        </div>

        <div class="victory-buttons">
            <button id="play-again">Restart Game</button>
            <button id="return-menu">Return to Menu</button>
        </div>

    </section>

    <script src="script.js"></script>
</body>

</html>
